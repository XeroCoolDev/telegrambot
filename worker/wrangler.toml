# Cloudflare Workers build of the bot. Run every wrangler command from this
# directory; `main` reaches back into the shared source tree.
name = "telegrambot"
account_id = "bd20beb67c1d692fe24565dcc13f56c2"
main = "../src/worker.ts"
compatibility_date = "2025-10-01"
# node:crypto (HMAC for Telegram initData, BTCPay signatures, claim tokens)
# and process.env for the shared code.
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

# One hostname per mini-app, both on this Worker. Custom domains need the zone
# on Cloudflare (Saltbox already manages DNS there). Commented out for the trial:
# the Worker then lives on workers.dev, where only the XeroCool app is reachable,
# because the Xposed app is chosen by hostname.
routes = [
  { pattern = "xerocool-bot.vodpanel.xyz/*", zone_name = "vodpanel.xyz" },
]

# Both mini-apps, built by ./build-assets.sh into public/app-xerocool and
# public/app-xposed. The Worker picks one by hostname and does the SPA
# fallback itself, so the platform must not redirect or rewrite paths.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
not_found_handling = "none"

# D1 replaces /opt/telegrambot/data/bot.db. Create it with
#   wrangler d1 create telegrambot
# and paste the id it prints here.
[[d1_databases]]
binding = "BOT_DB"
database_name = "telegrambot"
database_id = "37e13f60-95f9-405e-ac89-86fb3ef072e4"
migrations_dir = "migrations"

# Daily job (expiry + top-up reminders). Cron Triggers run in UTC — the Docker
# build ran REMINDER_CRON in the container's TZ (Europe/London), so 09:00 local
# is 09:00 UTC in winter and 08:00 UTC in summer.
[triggers]
crons = ["0 9 * * *"]

# Non-secret configuration. Same names as the Docker build's env.
# Secrets are NOT here — see README.md ("Secrets").
[vars]
XEROCOOL_WEBAPP_URL = "https://xerocool-bot.vodpanel.xyz"
XPOSED_WEBAPP_URL = "https://xposed-bot.example.com"
XEROCOOL_ADMIN_TELEGRAM_IDS = "428588578"
XEROCOOL_ADMIN_CHAT_ID = "-1003922039130"
XPOSED_SUPPORT_CHAT_ID = ""
XPOSED_AUTHORISED_TELEGRAM_IDS = ""

XUI_ADMIN_API_URL = "https://panel.solidcheese.com/vtRGOTrk"
XUI_RESELLER_API_URL = "https://panel.solidcheese.com/qkzwFWOM"
XUI_ADULT_BOUQUET_IDS = "7"

BTCPAY_URL = "https://btcpay168201.lndyn.com"
BTCPAY_STORE_ID = "6TnocvFQCa7kPWv3Zme3wYf2Qo7cjrNfQ1bpuToiU8hP"
BTCPAY_POS_APP_ID = "Kb18wpWZxYMQZeVYNEfXRwXkde6"

API_TIMEOUT_MS = "10000"
REMINDER_DAYS = "0,1,3"
TOPUP_REMINDER_DAYS = "30"
# Telegram messages one daily run may send; see worker/README.md "Limits"
DAILY_MESSAGE_BUDGET = "40"

MAX_CONNECTIONS = "3"
CONN_PRICE_1_2 = "4,2"
CONN_PRICE_1_3 = "7,4"
CONN_PRICE_2_3 = "3,2"
CONN_DISCOUNT_MONTHS = "6"
CONN_MULTIPLIER_MONTHS = "12"
EXTEND_CONN_LOCK_DAYS = "30"

RATE_LIMIT_MAX = "30"
RATE_LIMIT_WINDOW_MS = "60000"
