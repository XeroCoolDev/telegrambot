---
- name: "Setting CloudFlare DNS Record"
  ansible.builtin.include_role:
    name: dns
  vars:
    dns_record: "{{ lookup('vars', role_name + '_dns_record') }}"
    dns_zone: "{{ lookup('vars', role_name + '_dns_zone') }}"
    dns_proxy: "{{ lookup('vars', role_name + '_dns_proxy') }}"

- name: "Remove existing Docker container"
  ansible.builtin.include_tasks: "{{ resources_tasks_path }}/docker/remove_docker_container.yml"

- name: "Create directories"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ user.uid }}"
    group: "{{ user.gid }}"
    mode: "0775"
  loop: "{{ lookup('vars', role_name + '_paths_folders_list') }}"

- name: "Clone/update repository"
  ansible.builtin.git:
    repo: "{{ telegrambot_docker_build_repo }}"
    dest: "{{ telegrambot_paths_location }}/repo"
    version: "{{ telegrambot_docker_build_branch }}"
    force: true
  become: true
  become_user: "{{ user.name }}"
  when: telegrambot_docker_build

- name: "Build Docker image from source"
  community.docker.docker_image:
    name: "telegrambot"
    tag: "{{ telegrambot_docker_image_tag }}"
    source: build
    build:
      path: "{{ telegrambot_paths_location }}/repo"
      pull: true
    force_source: true
  when: telegrambot_docker_build

- name: "Set image name for built image"
  ansible.builtin.set_fact:
    telegrambot_docker_image_resolved: "telegrambot:{{ telegrambot_docker_image_tag }}"
  when: telegrambot_docker_build

- name: "Set image name for pulled image"
  ansible.builtin.set_fact:
    telegrambot_docker_image_resolved: "{{ telegrambot_docker_image }}"
  when: not telegrambot_docker_build

- name: "Create Docker container"
  ansible.builtin.include_tasks: "{{ resources_tasks_path }}/docker/create_docker_container.yml"
